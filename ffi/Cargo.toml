[package]
name = "lootlens-ffi"
description = "UniFFI bindings (Kotlin) for the Looting Glass core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "lootlens_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
lootlens-core = { path = "../core" }
uniffi = { version = "0.32", features = ["tokio", "cli"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
anyhow = "1"
